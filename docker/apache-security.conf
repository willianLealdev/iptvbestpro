# Segurança do Apache (copiado para /etc/apache2/conf-available pelo Dockerfile)

# Não mostrar versão do servidor
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    # /api.php/qualquer-coisa não roda o script (evita respostas estranhas e erros)
    AcceptPathInfo Off
</Directory>

# Pastas internas: nunca acessíveis pelo navegador
<DirectoryMatch "^/var/www/html/(includes|language|cron|vendor|docker)(/|$)">
    Require all denied
</DirectoryMatch>

# Uploads (images/, uploads/ e o volume /data): nunca executar PHP nem scripts
<DirectoryMatch "^/(var/www/html|data)/(images|uploads)(/|$)">
    php_admin_flag engine off
    Options -Indexes -ExecCGI
    RemoveHandler .php .phtml .phar .php3 .php4 .php5 .php7 .php8 .pht
    <FilesMatch "\.(php|phtml|phar|php\d|pht|cgi|pl|py|sh|htaccess)$">
        Require all denied
    </FilesMatch>
    # SVG enviado não pode rodar script se for aberto direto no navegador
    <FilesMatch "\.svg$">
        Header set Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src data:"
    </FilesMatch>
</DirectoryMatch>

# Arquivos e pastas internas respondem "não existe" (404) em vez de "proibido" (403): não confirma nada
# para quem fica testando endereços (.env, .git, backups, .sql, .json, pastas do sistema...).
# RedirectMatch roda antes das regras de acesso abaixo; /.well-known continua público (security.txt).
RedirectMatch 404 "^/(includes|language|cron|vendor|docker|install)(/|$)"
RedirectMatch 404 "(^|/)\.(?!well-known(/|$))"
RedirectMatch 404 "(?i)\.(sql|bak|old|orig|swp|log|ini|sh|md|lock|dist|env|json|yml|yaml|conf|lic|key|pem|p12|zip|tar|gz|7z|rar)$"

# Arquivos que não podem ser baixados
<FilesMatch "(^\.|\.(sql|lic|bak|old|orig|swp|log|ini|sh|md|lock|json|dist)$)">
    Require all denied
</FilesMatch>
<FilesMatch "^(smtp_email|thumbnail_images\.class|pagination)\.php$">
    Require all denied
</FilesMatch>

# Cabeçalhos de segurança
<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'"
    # Isolamento entre sites: o painel não pode ser aberto/controlado por outra janela de outro site,
    # e os arquivos do painel só carregam no próprio site — menos o que os apps de TV e e-mails precisam (abaixo)
    Header always set Cross-Origin-Opener-Policy "same-origin-allow-popups"
    Header always set Cross-Origin-Resource-Policy "same-site"
    Header always unset X-Powered-By
    Header unset X-Powered-By
</IfModule>

# Downloads do app: APK com o tipo certo (Android reconhece como instalador), sem PHP
AddType application/vnd.android.package-archive .apk
<Directory /var/www/html/downloads>
    php_admin_flag engine off
    Options -Indexes -ExecCGI
    <FilesMatch "\.apk$">
        Header set Content-Disposition "attachment; filename=\"iptvbestpro.apk\""
        # Não guardar em cache (Cloudflare/navegador): sempre a versão mais nova
        Header set Cache-Control "no-store, no-cache, must-revalidate, max-age=0"
    </FilesMatch>
</Directory>

# Páginas estáticas (app da TV LG/Samsung/Whale) com charset UTF-8 no cabeçalho (exigência da Whale TV)
AddDefaultCharset UTF-8

# Arquivos que os apps de TV (LG / Samsung / Whale), o app Android e os e-mails carregam de fora do site
<LocationMatch "^/(tv|assets|images|uploads|downloads|live|movie|series|\.well-known)/|^/(api|media|player_api|demo_stream|tv_xtream)(\.php)?$">
    Header always set Cross-Origin-Resource-Policy "cross-origin"
</LocationMatch>

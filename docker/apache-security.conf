# Segurança do Apache (copiado para /etc/apache2/conf-available pelo Dockerfile)

# Não mostrar versão do servidor
ServerTokens Prod
ServerSignature Off
TraceEnable Off

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
</Directory>

# Pastas internas: nunca acessíveis pelo navegador
<DirectoryMatch "^/var/www/html/(includes|language|cron|vendor|docker)(/|$)">
    Require all denied
</DirectoryMatch>

# Uploads (images/, uploads/ e o volume /data): nunca executar PHP nem scripts
<DirectoryMatch "^/(var/www/html|data)/(images|uploads)(/|$)">
    php_admin_flag engine off
    Options -Indexes -ExecCGI
    RemoveHandler .php .phtml .phar .php3 .php4 .php5 .php7 .php8 .pht
    <FilesMatch "\.(php|phtml|phar|php\d|pht|cgi|pl|py|sh|htaccess)$">
        Require all denied
    </FilesMatch>
    # SVG enviado não pode rodar script se for aberto direto no navegador
    <FilesMatch "\.svg$">
        Header set Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src data:"
    </FilesMatch>
</DirectoryMatch>

# Arquivos que não podem ser baixados
<FilesMatch "(^\.|\.(sql|lic|bak|old|orig|swp|log|ini|sh|md|lock|json|dist)$)">
    Require all denied
</FilesMatch>
<FilesMatch "^(smtp_email|thumbnail_images\.class|pagination)\.php$">
    Require all denied
</FilesMatch>

# Cabeçalhos de segurança
<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)"
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set Content-Security-Policy "frame-ancestors 'self'; base-uri 'self'; object-src 'none'"
    Header always unset X-Powered-By
    Header unset X-Powered-By
</IfModule>

# Downloads do app: APK com o tipo certo (Android reconhece como instalador), sem PHP
AddType application/vnd.android.package-archive .apk
<Directory /var/www/html/downloads>
    php_admin_flag engine off
    Options -Indexes -ExecCGI
    <FilesMatch "\.apk$">
        Header set Content-Disposition "attachment; filename=\"iptvbestpro.apk\""
    </FilesMatch>
</Directory>

# URLs limpas (sem .php) + imagens restauradas do banco.
# Copiado para /etc/apache2/conf-available pelo Dockerfile. Todas as regras de rewrite ficam neste único bloco.
<Directory /var/www/html>
    RewriteEngine On

    # 1) Navegação com .php no endereço -> redireciona para o endereço limpo (só GET; formulários POST seguem normais)
    #    Ficam de fora: API do app, imagens, pagamento (SSE/webhooks) e o processData (chamadas internas).
    RewriteCond %{REQUEST_METHOD} =GET
    RewriteCond %{THE_REQUEST} \s/+((?:[^?\s]*/)?)index\.php[\s?]
    RewriteCond %1 !^pagamento/
    RewriteRule ^ /%1 [R=301,L,NE]

    RewriteCond %{REQUEST_METHOD} =GET
    RewriteCond %{THE_REQUEST} \s/+([^?\s]+?)\.php[\s?]
    RewriteCond %1 !^(api|api_web|api_urls|media|processData)$
    RewriteCond %1 !^(pagamento|install|deactivate)/
    RewriteRule ^ /%1 [R=301,L,NE]

    # 2) Endereço limpo -> arquivo .php correspondente (interno, o navegador não vê)
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteCond %{REQUEST_FILENAME}.php -f
    RewriteRule ^(.+?)/?$ $1.php [L]

    # 3) Imagem que sumiu da pasta (ex.: após deploy) é entregue pela cópia do banco (media.php)
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteRule ^(images|uploads)/(.+)$ media.php?p=$1/$2 [L,QSA]
</Directory>
